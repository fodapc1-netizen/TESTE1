name: Vídeo diário para revisão
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
permissions:
  contents: write
concurrency:
  group: mundo3d-diario
  cancel-in-progress: false
jobs:
  criar:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMACAO_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Escolher um tema ainda não produzido
        id: fila
        run: node automacao/diario.cjs check
      - name: Instalar o motor
        if: steps.fila.outputs.pendente == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Recuperar roteiro e narração de tentativas anteriores
        if: steps.fila.outputs.pendente == 'true'
        uses: actions/cache/restore@v4
        with:
          path: videos/${{ steps.fila.outputs.id }}
          key: producao-${{ steps.fila.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: producao-${{ steps.fila.outputs.id }}-
      - name: Criar roteiro e cenas originais
        if: steps.fila.outputs.pendente == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node automacao/diario.cjs generate
      - name: Conferir cenas antes de comprar a narração
        if: steps.fila.outputs.pendente == 'true'
        env:
          VIDEO_ID: ${{ steps.fila.outputs.id }}
        run: node automacao/conferir-cena.cjs "videos/$VIDEO_ID"
      - name: Gerar a voz de André e renderizar
        if: steps.fila.outputs.pendente == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node automacao/diario.cjs render
      - name: Guardar progresso para evitar repetir narração
        if: always() && steps.fila.outputs.pendente == 'true'
        uses: actions/cache/save@v4
        with:
          path: videos/${{ steps.fila.outputs.id }}
          key: producao-${{ steps.fila.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Disponibilizar MP4 e materiais para revisão
        if: success() && steps.fila.outputs.pendente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mundo3D-${{ steps.fila.outputs.id }}
          path: entregas/${{ steps.fila.outputs.id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Registrar o vídeo concluído
        if: success() && steps.fila.outputs.pendente == 'true'
        run: |
          node automacao/diario.cjs complete
          git config user.name 'Mundo3D Automação'
          git config user.email 'mundo3d@users.noreply.github.com'
          git add automacao/concluidos.json
          git commit -m 'Registra vídeo gerado para revisão'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mostrar resultado
        if: success() && steps.fila.outputs.pendente == 'true'
        run: echo 'Vídeo pronto nos Artifacts desta execução. Revise antes de postar.' >> "$GITHUB_STEP_SUMMARY"
